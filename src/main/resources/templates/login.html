<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 学习资源导航系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
            overflow: hidden;
        }

        /* 背景装饰 */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: bgMove 20s linear infinite;
        }

        @keyframes bgMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* 浮动装饰圆 */
        .deco-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.06);
            animation: float 15s ease-in-out infinite;
        }
        .deco-circle:nth-child(1) {
            width: 300px;
            height: 300px;
            top: -80px;
            right: -60px;
            animation-delay: 0s;
        }
        .deco-circle:nth-child(2) {
            width: 200px;
            height: 200px;
            bottom: -40px;
            left: -40px;
            animation-delay: 3s;
        }
        .deco-circle:nth-child(3) {
            width: 120px;
            height: 120px;
            top: 30%;
            left: 10%;
            animation-delay: 6s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .login-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            width: 860px;
            max-width: 95vw;
            min-height: 520px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .login-wrapper:hover {
            box-shadow: 0 35px 80px rgba(0,0,0,0.4);
            transform: translateY(-5px);
        }

        /* 左侧装饰面板 */
        .left-panel {
            flex: 1;
            background: linear-gradient(135deg, #5a67d8 0%, #6b46c1 50%, #9f7aea 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px 40px;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .left-panel::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            top: -100px;
            right: -100px;
            animation: pulse 8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.7; }
        }

        .left-panel .brand-icon {
            width: 100px;
            height: 100px;
            background: rgba(255,255,255,0.2);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            margin-bottom: 35px;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        .left-panel .brand-icon:hover {
            transform: scale(1.05) rotate(5deg);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .left-panel h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 15px;
            text-align: center;
            line-height: 1.2;
        }

        .left-panel p {
            font-size: 16px;
            opacity: 0.85;
            line-height: 1.7;
            text-align: center;
            max-width: 280px;
            margin-bottom: 45px;
        }

        .feature-list {
            list-style: none;
            width: 100%;
            max-width: 280px;
        }

        .feature-list li {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 16px;
            animation: slideInLeft 0.6s ease forwards;
            opacity: 0;
        }

        .feature-list li:nth-child(1) { animation-delay: 0.2s; }
        .feature-list li:nth-child(2) { animation-delay: 0.4s; }
        .feature-list li:nth-child(3) { animation-delay: 0.6s; }
        .feature-list li:nth-child(4) { animation-delay: 0.8s; }

        @keyframes slideInLeft {
            from {
                transform: translateX(-30px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .feature-list li .icon {
            width: 32px;
            height: 32px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .feature-list li:hover .icon {
            transform: scale(1.1);
            background: rgba(255,255,255,0.3);
        }

        /* 右侧表单面板 */
        .right-panel {
            flex: 1;
            background: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 50px 45px;
            position: relative;
            overflow: hidden;
        }

        .right-panel::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.05));
            border-radius: 0 24px 0 50%;
        }

        .right-panel h1 {
            font-size: 32px;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 10px;
            animation: slideInRight 0.6s ease forwards;
        }

        .right-panel .subtitle {
            font-size: 15px;
            color: #a0aec0;
            margin-bottom: 40px;
            animation: slideInRight 0.6s ease 0.2s forwards;
            opacity: 0;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(30px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .form-group {
            margin-bottom: 24px;
            position: relative;
            animation: slideInRight 0.6s ease forwards;
            opacity: 0;
        }

        .form-group:nth-child(3) { animation-delay: 0.3s; }
        .form-group:nth-child(4) { animation-delay: 0.4s; }
        .form-group:nth-child(5) { animation-delay: 0.5s; }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 8px;
            transition: color 0.3s ease;
        }

        .form-group:focus-within label {
            color: #667eea;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: #a0aec0;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            font-size: 15px;
            color: #2d3748;
            outline: none;
            transition: all 0.3s ease;
            background: #f7fafc;
            font-family: inherit;
        }

        .input-wrapper input:focus {
            border-color: #667eea;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
            transform: translateY(-2px);
        }

        .input-wrapper input:focus + .input-icon,
        .input-wrapper input:focus ~ .input-icon {
            color: #667eea;
            transform: translateY(-50%) scale(1.1);
        }

        .form-group input[type="checkbox"] {
            width: auto;
            padding: 0;
            margin-right: 10px;
            accent-color: #667eea;
            cursor: pointer;
            transform: scale(1.1);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: #718096;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            margin-bottom: 0;
            cursor: pointer;
            font-weight: 400;
            transition: color 0.3s ease;
        }

        .checkbox-group label:hover {
            color: #4a5568;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
            letter-spacing: 0.5px;
            font-family: inherit;
            position: relative;
            overflow: hidden;
            animation: slideInRight 0.6s ease 0.6s forwards;
            opacity: 0;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.6s ease;
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.5);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .login-btn:disabled::before {
            display: none;
        }

        .register-link {
            text-align: center;
            margin-top: 30px;
            font-size: 14px;
            color: #a0aec0;
            animation: slideInRight 0.6s ease 0.7s forwards;
            opacity: 0;
        }

        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
        }

        .register-link a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: #667eea;
            transition: width 0.3s ease;
        }

        .register-link a:hover {
            color: #764ba2;
        }

        .register-link a:hover::after {
            width: 100%;
        }

        /* 错误提示 */
        .error-msg {
            display: none;
            background: #fff5f5;
            border: 1px solid #fed7d7;
            color: #c53030;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(205, 51, 51, 0.1);
            animation: slideInRight 0.6s ease forwards;
        }

        .error-msg.show {
            display: block;
            animation: shake 0.4s ease, slideInRight 0.6s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        /* 加载动画 */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .left-panel { display: none; }
            .login-wrapper { 
                max-width: 420px; 
                min-height: auto;
                margin: 20px;
            }
            .right-panel { 
                padding: 40px 30px;
                border-radius: 24px;
            }
            .right-panel h1 {
                font-size: 28px;
            }
        }

        /* 深色模式支持 */
        @media (prefers-color-scheme: dark) {
            .right-panel {
                background: #1a202c;
            }
            .right-panel h1 {
                color: #f7fafc;
            }
            .right-panel .subtitle {
                color: #a0aec0;
            }
            .form-group label {
                color: #e2e8f0;
            }
            .input-wrapper input {
                background: #2d3748;
                border-color: #4a5568;
                color: #f7fafc;
            }
            .input-wrapper input:focus {
                background: #2d3748;
                box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.2);
            }
            .checkbox-group {
                color: #a0aec0;
            }
            .register-link {
                color: #718096;
            }
            .error-msg {
                background: #2d1d1e;
                border-color: #553c3d;
                color: #fed7d7;
            }
        }
    </style>
</head>
<body>
    <div class="deco-circle"></div>
    <div class="deco-circle"></div>
    <div class="deco-circle"></div>

    <div class="login-wrapper">
        <div class="left-panel">
            <div class="brand-icon">📚</div>
            <h2>学习资源导航系统</h2>
            <p>一站式发现和管理优质学习资源，开启高效学习之旅</p>
            <ul class="feature-list">
                <li><span class="icon">🔍</span> 多学科资源分类导航</li>
                <li><span class="icon">🎯</span> 学习路径智能规划</li>
                <li><span class="icon">📊</span> 学习进度实时追踪</li>
                <li><span class="icon">📝</span> 在线笔记便捷记录</li>
            </ul>
        </div>

        <div class="right-panel">
            <h1>欢迎回来</h1>
            <p class="subtitle">登录你的账号，继续学习之旅</p>

            <div class="error-msg" id="errorMsg"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" placeholder="请输入用户名" required autocomplete="username">
                        <span class="input-icon">👤</span>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="请输入密码" required autocomplete="current-password">
                        <span class="input-icon">🔒</span>
                    </div>
                </div>
                <div class="form-group">
                    <div class="checkbox-group">
                        <label>
                            <input type="checkbox" id="rememberMe">
                            记住我
                        </label>
                    </div>
                </div>
                <button type="submit" class="login-btn" id="loginBtn">
                    <span id="btnText">登 录</span>
                </button>
                <div class="register-link">
                    还没有账号？ <a href="/register">立即注册</a>
                </div>
                <div style="text-align: center; margin-top: 1rem;">
                    <a href="javascript:void(0)" id="forgotPasswordLink" style="color: #007bff; text-decoration: none; font-size: 0.9rem;">忘记密码？</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 处理URL参数，显示错误信息
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const error = urlParams.get('error');
            const message = urlParams.get('message');
            
            if (error === 'access_denied' && message) {
                const errorMsg = decodeURIComponent(message);
                showError(errorMsg);
            }
        };

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 4000);
        }

        document.getElementById('loginForm').onsubmit = function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');

            if (!username || !password) {
                showError('请填写所有字段');
                return;
            }

            btn.disabled = true;
            btnText.innerHTML = '<span class="loading-spinner"></span>登录中...';
            
            const data = {
                username: username,
                password: password,
                rememberMe: rememberMe
            };
            
            fetch('/api/public/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(data => {
                btn.disabled = false;
                btnText.textContent = '登 录';
                if (data.code === 200) {
                    if (data.data && data.data.token) {
                        localStorage.setItem('token', data.data.token);
                        // 存储完整用户信息（含vipExpireDate），避免VIP状态切换页面后丢失
                        const userData = {
                            username: data.data.username,
                            email: data.data.email,
                            role: data.data.role,
                            userId: data.data.userId,
                            vipExpireDate: data.data.vipExpireDate || null,
                            avatar: data.data.avatar || null
                        };
                        localStorage.setItem('user', JSON.stringify(userData));
                    }
                    window.location.href = '/';
                } else {
                    showError(data.message || '登录失败，请检查用户名和密码');
                }
            })
            .catch(err => {
                btn.disabled = false;
                btnText.textContent = '登 录';
                showError('网络错误，请稍后重试');
            });
        };

        // 忘记密码功能
        document.getElementById('forgotPasswordLink').addEventListener('click', function() {
            showForgotPasswordModal();
        });

        function showForgotPasswordModal() {
            const modal = document.createElement('div');
            modal.id = 'forgotPasswordModal';
            modal.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); z-index: 2000; display: flex; align-items: center; justify-content: center;';
            modal.innerHTML = `
                <div style="background: white; padding: 2rem; border-radius: 8px; max-width: 400px; width: 90%;">
                    <h3 style="margin-bottom: 1rem;">忘记密码</h3>
                    <div style="margin-bottom: 1rem;">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">用户名</label>
                        <input type="text" id="forgotUsername" placeholder="请输入用户名" style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px;">
                    </div>
                    <div style="margin-bottom: 1rem;">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">手机号</label>
                        <input type="tel" id="forgotPhone" placeholder="请输入注册时的手机号" style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px;">
                    </div>
                    <div style="margin-bottom: 1rem;">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">验证码</label>
                        <div style="display: flex; gap: 0.5rem;">
                            <input type="text" id="forgotCode" placeholder="请输入验证码" maxlength="6" style="flex: 1; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px;">
                            <button type="button" id="forgotSendCodeBtn" style="padding: 0.5rem 1rem; border: 1px solid #007bff; border-radius: 4px; background-color: white; color: #007bff; cursor: pointer; font-weight: 500; white-space: nowrap;">发送验证码</button>
                        </div>
                    </div>
                    <div style="margin-bottom: 1rem;">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">新密码</label>
                        <input type="password" id="forgotNewPassword" placeholder="请输入新密码（至少6位）" style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px;">
                    </div>
                    <div id="forgotError" style="color: #ff4444; font-size: 0.85rem; margin-bottom: 1rem; display: none;"></div>
                    <div style="display: flex; gap: 1rem;">
                        <button type="button" id="forgotConfirmBtn" style="flex: 1; padding: 0.75rem; border: none; border-radius: 4px; background-color: #007bff; color: white; cursor: pointer; font-weight: 500;">确认修改</button>
                        <button type="button" id="forgotCancelBtn" style="flex: 1; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; background-color: white; cursor: pointer; font-weight: 500;">取消</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            let countdown = 0;
            document.getElementById('forgotSendCodeBtn').addEventListener('click', function() {
                if (countdown > 0) return;
                const username = document.getElementById('forgotUsername').value;
                const phone = document.getElementById('forgotPhone').value;
                if (!username.trim()) {
                    document.getElementById('forgotError').textContent = '请输入用户名';
                    document.getElementById('forgotError').style.display = 'block';
                    return;
                }
                if (!phone || !/^1[3-9]\d{9}$/.test(phone)) {
                    document.getElementById('forgotError').textContent = '请输入正确的手机号';
                    document.getElementById('forgotError').style.display = 'block';
                    return;
                }
                fetch('/api/user/send-verification-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, phone: phone })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.code === 200) {
                        alert('验证码：' + data.message);
                        countdown = 60;
                        const btn = document.getElementById('forgotSendCodeBtn');
                        btn.textContent = countdown + '秒后重试';
                        const timer = setInterval(() => {
                            countdown--;
                            btn.textContent = countdown > 0 ? countdown + '秒后重试' : '发送验证码';
                            if (countdown <= 0) clearInterval(timer);
                        }, 1000);
                    } else {
                        document.getElementById('forgotError').textContent = data.message || '发送失败';
                        document.getElementById('forgotError').style.display = 'block';
                    }
                });
            });

            document.getElementById('forgotConfirmBtn').addEventListener('click', function() {
                const username = document.getElementById('forgotUsername').value;
                const phone = document.getElementById('forgotPhone').value;
                const code = document.getElementById('forgotCode').value;
                const newPassword = document.getElementById('forgotNewPassword').value;
                const errorDiv = document.getElementById('forgotError');

                if (!username.trim()) {
                    errorDiv.textContent = '请输入用户名';
                    errorDiv.style.display = 'block';
                    return;
                }
                if (!phone || !/^1[3-9]\d{9}$/.test(phone)) {
                    errorDiv.textContent = '请输入正确的手机号';
                    errorDiv.style.display = 'block';
                    return;
                }
                if (!code || code.length !== 6) {
                    errorDiv.textContent = '请输入6位验证码';
                    errorDiv.style.display = 'block';
                    return;
                }
                if (!newPassword || newPassword.length < 6) {
                    errorDiv.textContent = '新密码至少6位';
                    errorDiv.style.display = 'block';
                    return;
                }

                fetch('/api/user/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: username,
                        phone: phone,
                        verificationCode: code,
                        newPassword: newPassword
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.code === 200) {
                        alert('密码修改成功，请使用新密码登录');
                        document.body.removeChild(modal);
                    } else {
                        errorDiv.textContent = data.message || '修改失败';
                        errorDiv.style.display = 'block';
                    }
                });
            });

            document.getElementById('forgotCancelBtn').addEventListener('click', function() {
                document.body.removeChild(modal);
            });

            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    document.body.removeChild(modal);
                }
            });
        }
    </script>
</body>
</html>
