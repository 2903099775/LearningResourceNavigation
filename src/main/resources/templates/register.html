<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 学习资源导航系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
            overflow: hidden;
        }

        /* 背景装饰 */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: bgMove 20s linear infinite;
        }

        @keyframes bgMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* 浮动装饰圆 */
        .deco-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.06);
            animation: float 15s ease-in-out infinite;
        }
        .deco-circle:nth-child(1) {
            width: 300px;
            height: 300px;
            top: -80px;
            right: -60px;
            animation-delay: 0s;
        }
        .deco-circle:nth-child(2) {
            width: 200px;
            height: 200px;
            bottom: -40px;
            left: -40px;
            animation-delay: 3s;
        }
        .deco-circle:nth-child(3) {
            width: 120px;
            height: 120px;
            top: 30%;
            left: 10%;
            animation-delay: 6s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .login-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            width: 860px;
            max-width: 95vw;
            min-height: 520px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .login-wrapper:hover {
            box-shadow: 0 35px 80px rgba(0,0,0,0.4);
            transform: translateY(-5px);
        }

        /* 左侧装饰面板 */
        .left-panel {
            flex: 1;
            background: linear-gradient(135deg, #5a67d8 0%, #6b46c1 50%, #9f7aea 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px 40px;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .left-panel::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            top: -100px;
            right: -100px;
            animation: pulse 8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.7; }
        }

        .left-panel .brand-icon {
            width: 100px;
            height: 100px;
            background: rgba(255,255,255,0.2);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            margin-bottom: 35px;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        .left-panel .brand-icon:hover {
            transform: scale(1.05) rotate(5deg);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .left-panel h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 15px;
            text-align: center;
            line-height: 1.2;
        }

        .left-panel p {
            font-size: 16px;
            opacity: 0.85;
            line-height: 1.7;
            text-align: center;
            max-width: 280px;
            margin-bottom: 45px;
        }

        .feature-list {
            list-style: none;
            width: 100%;
            max-width: 280px;
        }

        .feature-list li {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 16px;
            animation: slideInLeft 0.6s ease forwards;
            opacity: 0;
        }

        .feature-list li:nth-child(1) { animation-delay: 0.2s; }
        .feature-list li:nth-child(2) { animation-delay: 0.4s; }
        .feature-list li:nth-child(3) { animation-delay: 0.6s; }
        .feature-list li:nth-child(4) { animation-delay: 0.8s; }

        @keyframes slideInLeft {
            from {
                transform: translateX(-30px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .feature-list li .icon {
            width: 32px;
            height: 32px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .feature-list li:hover .icon {
            transform: scale(1.1);
            background: rgba(255,255,255,0.3);
        }

        /* 右侧表单面板 */
        .right-panel {
            flex: 1;
            background: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 50px 45px;
            position: relative;
            overflow: hidden;
        }

        .right-panel::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.05));
            border-radius: 0 24px 0 50%;
        }

        .right-panel h1 {
            font-size: 32px;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 10px;
            animation: slideInRight 0.6s ease forwards;
        }

        .right-panel .subtitle {
            font-size: 15px;
            color: #a0aec0;
            margin-bottom: 40px;
            animation: slideInRight 0.6s ease 0.2s forwards;
            opacity: 0;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(30px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .form-group {
            margin-bottom: 24px;
            position: relative;
            animation: slideInRight 0.6s ease forwards;
            opacity: 0;
        }

        .form-group:nth-child(3) { animation-delay: 0.3s; }
        .form-group:nth-child(4) { animation-delay: 0.4s; }
        .form-group:nth-child(5) { animation-delay: 0.5s; }
        .form-group:nth-child(6) { animation-delay: 0.6s; }
        .form-group:nth-child(7) { animation-delay: 0.7s; }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 8px;
            transition: color 0.3s ease;
        }

        .form-group:focus-within label {
            color: #667eea;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: #a0aec0;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            font-size: 15px;
            color: #2d3748;
            outline: none;
            transition: all 0.3s ease;
            background: #f7fafc;
            font-family: inherit;
        }

        .input-wrapper input:focus {
            border-color: #667eea;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
            transform: translateY(-2px);
        }

        .input-wrapper input:focus + .input-icon,
        .input-wrapper input:focus ~ .input-icon {
            color: #667eea;
            transform: translateY(-50%) scale(1.1);
        }

        .form-group input[type="checkbox"] {
            width: auto;
            padding: 0;
            margin-right: 10px;
            accent-color: #667eea;
            cursor: pointer;
            transform: scale(1.1);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: #718096;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            margin-bottom: 0;
            cursor: pointer;
            font-weight: 400;
            transition: color 0.3s ease;
        }

        .checkbox-group label:hover {
            color: #4a5568;
        }

        .checkbox-group a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
        }

        .checkbox-group a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: #667eea;
            transition: width 0.3s ease;
        }

        .checkbox-group a:hover {
            color: #764ba2;
        }

        .checkbox-group a:hover::after {
            width: 100%;
        }

        .register-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
            letter-spacing: 0.5px;
            font-family: inherit;
            position: relative;
            overflow: hidden;
            animation: slideInRight 0.6s ease 0.8s forwards;
            opacity: 0;
        }

        .register-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.6s ease;
        }

        .register-btn:hover::before {
            left: 100%;
        }

        .register-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.5);
        }

        .register-btn:active {
            transform: translateY(0);
        }

        .register-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .register-btn:disabled::before {
            display: none;
        }

        .login-link {
            text-align: center;
            margin-top: 30px;
            font-size: 14px;
            color: #a0aec0;
            animation: slideInRight 0.6s ease 0.9s forwards;
            opacity: 0;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
        }

        .login-link a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: #667eea;
            transition: width 0.3s ease;
        }

        .login-link a:hover {
            color: #764ba2;
        }

        .login-link a:hover::after {
            width: 100%;
        }

        /* 错误提示 */
        .error-msg {
            display: none;
            background: #fff5f5;
            border: 1px solid #fed7d7;
            color: #c53030;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(205, 51, 51, 0.1);
            animation: slideInRight 0.6s ease forwards;
        }

        .error-msg.show {
            display: block;
            animation: shake 0.4s ease, slideInRight 0.6s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        /* 加载动画 */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 密码强度 */
        .password-strength {
            margin-top: 8px;
            font-size: 12px;
            color: #a0aec0;
            transition: all 0.3s ease;
        }

        .strength-weak {
            color: #c53030;
        }

        .strength-medium {
            color: #d69e2e;
        }

        .strength-strong {
            color: #2f855a;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .left-panel { display: none; }
            .login-wrapper { 
                max-width: 420px; 
                min-height: auto;
                margin: 20px;
            }
            .right-panel { 
                padding: 40px 30px;
                border-radius: 24px;
            }
            .right-panel h1 {
                font-size: 28px;
            }
        }

        /* 深色模式支持 */
        @media (prefers-color-scheme: dark) {
            .right-panel {
                background: #1a202c;
            }
            .right-panel h1 {
                color: #f7fafc;
            }
            .right-panel .subtitle {
                color: #a0aec0;
            }
            .form-group label {
                color: #e2e8f0;
            }
            .input-wrapper input {
                background: #2d3748;
                border-color: #4a5568;
                color: #f7fafc;
            }
            .input-wrapper input:focus {
                background: #2d3748;
                box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.2);
            }
            .checkbox-group {
                color: #a0aec0;
            }
            .login-link {
                color: #718096;
            }
            .error-msg {
                background: #2d1d1e;
                border-color: #553c3d;
                color: #fed7d7;
            }
        }
    </style>
</head>
<body>
    <div class="deco-circle"></div>
    <div class="deco-circle"></div>
    <div class="deco-circle"></div>

    <div class="login-wrapper">
        <div class="left-panel">
            <div class="brand-icon">📚</div>
            <h2>学习资源导航系统</h2>
            <p>一站式发现和管理优质学习资源，开启高效学习之旅</p>
            <ul class="feature-list">
                <li><span class="icon">🔍</span> 多学科资源分类导航</li>
                <li><span class="icon">🎯</span> 学习路径智能规划</li>
                <li><span class="icon">📊</span> 学习进度实时追踪</li>
                <li><span class="icon">📝</span> 在线笔记便捷记录</li>
            </ul>
        </div>

        <div class="right-panel">
            <h1>创建新账号</h1>
            <p class="subtitle">注册账号，开始你的学习之旅</p>

            <div class="error-msg" id="errorMsg"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" placeholder="请输入用户名" required autocomplete="username">
                        <span class="input-icon">👤</span>
                    </div>
                    <div class="error-msg" id="usernameError"></div>
                </div>
                <div class="form-group">
                    <label for="email">邮箱</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" placeholder="请输入邮箱" required autocomplete="email">
                        <span class="input-icon">📧</span>
                    </div>
                    <div class="error-msg" id="emailError"></div>
                </div>
                <div class="form-group">
                    <label for="phone">手机号（选填）</label>
                    <div class="input-wrapper">
                        <input type="tel" id="phone" placeholder="请输入手机号" autocomplete="tel">
                        <span class="input-icon">📱</span>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="请输入密码" required autocomplete="new-password">
                        <span class="input-icon">🔒</span>
                    </div>
                    <div class="password-strength" id="passwordStrength">密码强度：请输入密码</div>
                    <div class="error-msg" id="passwordError"></div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">确认密码</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirmPassword" placeholder="请确认密码" required autocomplete="new-password">
                        <span class="input-icon">🔒</span>
                    </div>
                    <div class="error-msg" id="confirmPasswordError"></div>
                </div>
                <div class="form-group">
                    <div class="checkbox-group">
                        <label>
                            <input type="checkbox" id="terms" required>
                            我已阅读并同意 <a href="#">用户协议</a> 和 <a href="#">隐私政策</a>
                        </label>
                    </div>
                    <div class="error-msg" id="termsError"></div>
                </div>
                <button type="submit" class="register-btn" id="registerButton">
                    <span id="btnText">注 册</span>
                </button>
                <div class="login-link">
                    已有账号？ <a href="/login">立即登录</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const registerForm = document.getElementById('registerForm');
            const username = document.getElementById('username');
            const email = document.getElementById('email');
            const phone = document.getElementById('phone');
            const password = document.getElementById('password');
            const confirmPassword = document.getElementById('confirmPassword');
            const terms = document.getElementById('terms');
            const registerButton = document.getElementById('registerButton');
            const passwordStrength = document.getElementById('passwordStrength');
            const btnText = document.getElementById('btnText');
            
            function showError(msg, elementId) {
                if (elementId) {
                    const el = document.getElementById(elementId);
                    el.textContent = msg;
                    el.classList.add('show');
                    setTimeout(() => el.classList.remove('show'), 4000);
                } else {
                    const el = document.getElementById('errorMsg');
                    el.textContent = msg;
                    el.classList.add('show');
                    setTimeout(() => el.classList.remove('show'), 4000);
                }
            }
            
            // 密码强度检测
            password.addEventListener('input', function() {
                const passwordValue = this.value;
                let strength = 'weak';
                let message = '密码强度：弱';
                
                if (passwordValue.length >= 6) {
                    if (passwordValue.length >= 8 && /[A-Z]/.test(passwordValue) && /[0-9]/.test(passwordValue)) {
                        strength = 'strong';
                        message = '密码强度：强';
                    } else {
                        strength = 'medium';
                        message = '密码强度：中等';
                    }
                } else {
                    message = '密码强度：请输入密码';
                }
                
                passwordStrength.textContent = message;
                passwordStrength.className = 'password-strength strength-' + strength;
            });
            
            // 表单验证
            function validateForm() {
                let isValid = true;
                
                // 重置错误信息
                document.querySelectorAll('.error-msg').forEach(el => el.classList.remove('show'));
                
                if (!username.value.trim()) {
                    showError('请输入用户名', 'usernameError');
                    isValid = false;
                }
                
                if (!email.value.trim()) {
                    showError('请输入邮箱', 'emailError');
                    isValid = false;
                } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)) {
                    showError('请输入有效的邮箱地址', 'emailError');
                    isValid = false;
                }
                
                if (!password.value) {
                    showError('请输入密码', 'passwordError');
                    isValid = false;
                } else if (password.value.length < 6) {
                    showError('密码长度至少为6位', 'passwordError');
                    isValid = false;
                }
                
                if (!confirmPassword.value) {
                    showError('请确认密码', 'confirmPasswordError');
                    isValid = false;
                } else if (password.value !== confirmPassword.value) {
                    showError('两次密码不一致', 'confirmPasswordError');
                    isValid = false;
                }
                
                if (!terms.checked) {
                    showError('请同意用户协议和隐私政策', 'termsError');
                    isValid = false;
                }
                
                return isValid;
            }
            
            registerForm.onsubmit = function(e) {
                e.preventDefault();
                
                if (!validateForm()) {
                    return;
                }
                
                // 显示加载状态
                registerButton.disabled = true;
                btnText.innerHTML = '<span class="loading-spinner"></span>注册中...';
                
                const data = {
                    username: username.value.trim(),
                    email: email.value.trim(),
                    phone: phone.value.trim() || null,
                    password: password.value
                };
                
                fetch('/api/public/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                })
                .then(res => res.json())
                .then(data => {
                    // 恢复按钮状态
                    registerButton.disabled = false;
                    btnText.textContent = '注 册';
                    
                    if (data.code === 200) {
                        // 显示成功消息
                        showError('注册成功！即将自动登录...');
                        
                        // 注册成功后自动登录
                        setTimeout(() => {
                            fetch('/api/public/auth/login', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ username: username.value.trim(), password: password.value })
                            })
                            .then(res => res.json())
                            .then(loginData => {
                                if (loginData.code === 200 && loginData.data && loginData.data.token) {
                                    localStorage.setItem('token', loginData.data.token);
                                    const userData = {
                                        username: loginData.data.username,
                                        email: loginData.data.email,
                                        role: loginData.data.role,
                                        userId: loginData.data.userId,
                                        vipExpireDate: loginData.data.vipExpireDate || null,
                                        avatar: loginData.data.avatar || null
                                    };
                                    localStorage.setItem('user', JSON.stringify(userData));
                                    window.location.href = '/';
                                } else {
                                    window.location.href = '/login';
                                }
                            })
                            .catch(() => {
                                window.location.href = '/login';
                            });
                        }, 1000);
                    } else {
                        // 显示错误消息
                        showError('注册失败：' + data.message);
                    }
                })
                .catch(err => {
                    // 恢复按钮状态
                    registerButton.disabled = false;
                    btnText.textContent = '注 册';
                    
                    // 显示错误消息
                    showError('注册失败，请稍后重试');
                });
            };
        });
    </script>
</body>
</html>
