# 应用配置
spring.application.name=learning-resource-navigation
server.port=8080
server.address=127.0.0.1

# 字符编码配置
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# Tomcat配置
server.tomcat.threads.max=500
server.tomcat.threads.min-spare=100
server.tomcat.connection-timeout=10000
server.tomcat.accept-count=200
server.tomcat.max-connections=20000
server.tomcat.basedir=./temp
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b %D
server.tomcat.max-http-header-size=65536
server.tomcat.max-swallow-size=-1

# Spring MVC JSON配置
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Shanghai

# 数据库配置 - MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/learning_nav?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&connectTimeout=30000&socketTimeout=60000
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 禁用H2控制台
spring.h2.console.enabled=false



# HikariCP连接池配置
spring.datasource.hikari.initial-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# 数据库初始化配置（不自动执行，防止每次启动重置数据）
spring.sql.init.mode=never
spring.sql.init.encoding=UTF-8

# MyBatis配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.learning.entity
mybatis.configuration.map-underscore-to-camel-case=true

# 日志配置
logging.level.com.learning=debug
logging.level.com.learning.controller.LearningCategoryController=debug
logging.level.com.learning.service.LearningCategoryService=debug
logging.level.com.learning.service.impl.LearningCategoryServiceImpl=debug
logging.level.com.learning.mapper.LearningCategoryMapper=debug
logging.level.org.springframework.security=debug
logging.level.com.learning.controller.AuthController=debug
logging.level.com.learning.service.impl.AuthServiceImpl=debug
logging.level.org.springframework.web=debug

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT配置
jwt.secret=${JWT_SECRET:learning_resource_navigation_system_secret_key_for_jwt_generation_2024_minimum_64_bytes}
jwt.expiration=86400000
jwt.refresh.expiration=604800000
jwt.header=Authorization

# 缓存配置
spring.cache.type=caffeine
spring.cache.caffeine.spec=initialCapacity=500,maximumSize=2000,expireAfterWrite=1800s,recordStats

# Redis配置（可选，用于分布式缓存）
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=
spring.redis.database=0
